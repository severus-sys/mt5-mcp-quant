name: Rust (Windows)

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-contract:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test all targets
        run: cargo test --all-targets
      - name: Build release binary
        run: cargo build --release
      - name: Validate bridge, provider, and skills fixtures
        shell: pwsh
        run: ./tests/contract_fixtures.ps1
      - name: Validate exact 96-tool MCP contract
        shell: pwsh
        run: ./tests/e2e_all_tools.ps1 -Binary ./target/release/mt5-mcp-quant.exe -ContractOnly
      - uses: actions/upload-artifact@v4
        with:
          name: mt5-mcp-quant-windows-ci-${{ github.sha }}
          path: target/release/mt5-mcp-quant.exe
          if-no-files-found: error
